# Kafka TLS certificate secret (Fase 14 — K-6).
#
# TEMPLATE — jangan di-apply apa adanya. Ganti nilai placeholder di bawah dengan
# keystore/truststore JKS asli (base64), lalu:
#
#   kubectl -n pointofsale create secret generic kafka-tls \
#     --from-file=kafka.keystore.jks=/path/to/kafka.keystore.jks \
#     --from-file=kafka.truststore.jks=/path/to/kafka.truststore.jks
#
# Generator sertifikat disediakan image bitnami: kafka-generate-ssl.sh
# (Common Name/FQDN harus kafka.pointofsale.svc.cluster.local).
#
# Catatan: secret ini TIDAK dimasukkan ke kustomization.yaml (volume mount di
# kafka-deployment.yaml memakai `optional: true`), sehingga `kubectl apply -k`
# tetap jalan untuk konfigurasi non-produksi.
apiVersion: v1
kind: Secret
metadata:
  name: kafka-tls
  namespace: pointofsale
type: Opaque
data:
  # base64 dari kafka.keystore.jks (private key broker + cert chain)
  kafka.keystore.jks: "PLACEHOLDER_BASE64_KEYSTORE"
  # base64 dari kafka.truststore.jks (CA yang memverifikasi klien)
  kafka.truststore.jks: "PLACEHOLDER_BASE64_TRUSTSTORE"
