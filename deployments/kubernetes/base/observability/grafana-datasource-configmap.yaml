apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: pointofsale
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.pointofsale.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.pointofsale.svc.cluster.local:3100
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.pointofsale.svc.cluster.local:16686
