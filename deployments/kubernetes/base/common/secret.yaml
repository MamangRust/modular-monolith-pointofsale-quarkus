apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: pointofsale
type: Opaque
stringData:
  DB_USERNAME: "DRAGON"
  DB_PASSWORD: "DRAGON"

  POSTGRES_USER: "DRAGON"
  POSTGRES_PASSWORD: "DRAGON"

  DB_URL: "postgres://$(DB_USERNAME):$(DB_PASSWORD)@postgres:5432/POINTOFSALE"

  GF_SECURITY_ADMIN_PASSWORD: "admin"
  
  SECRET_KEY: "yantopedia"
  REDIS_PASSWORD: "dragon_knight"

  SMTP_USER: "julius.davis@ethereal.email"
  SMTP_PASS: "4vWXpZfTMPAazhVZFU"

  # ── Kafka SASL/SCRAM + TLS (Fase 14 — K-6) ──────────────────────────────
  # Broker listener produksi memakai SASL_SSL (lihat base/kafka/kafka-deployment.yaml).
  # Nilai di bawah placeholder — ganti dengan kredensial nyata (ExternalSecret
  # direkomendasikan di produksi, mis. `pos-secrets`).
  KAFKA_CLIENT_USER: "app"
  KAFKA_CLIENT_PASSWORD: "CHANGE_ME_KAFKA_CLIENT_PASSWORD"
  KAFKA_CONTROLLER_USER: "controller_user"
  KAFKA_CONTROLLER_PASSWORD: "CHANGE_ME_KAFKA_CONTROLLER_PASSWORD"
  KAFKA_CERTIFICATE_PASSWORD: "CHANGE_ME_KAFKA_CERT_PASSWORD"
  # JAAS config untuk client (dipakai oleh KafkaSecurity.fromEnv() di semua service).
  KAFKA_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"app\" password=\"CHANGE_ME_KAFKA_CLIENT_PASSWORD\";"
