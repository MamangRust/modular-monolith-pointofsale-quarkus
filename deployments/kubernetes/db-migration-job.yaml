apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: pointofsale
spec:
  template:
    metadata:
      labels:
        app: db-migration
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for Postgres to be ready (TCP)..."
              until nc -z postgres.pointofsale.svc.cluster.local 5432; do
                echo "Postgres is not ready yet. Waiting 5 seconds..."
                sleep 5
              done
              echo "Postgres is ready!"
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      containers:
        - name: db-migration
          image: monolith-point-of-sale-grpc-vertx/db-migration:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USERNAME
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      restartPolicy: OnFailure
  backoffLimit: 4
