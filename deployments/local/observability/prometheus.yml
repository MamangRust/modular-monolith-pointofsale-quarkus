global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  # Phase 6: OTel metrics (email-* counters, kafka_consumer_lag, durations)
  # arrive via otel-collector's Prometheus exporter on :8889. Without this job
  # the email-service alert rules have no data locally.
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]
  - job_name: "quarkus-services"
    metrics_path: /q/metrics
    static_configs:
      - targets: ["apigateway:5000"]
