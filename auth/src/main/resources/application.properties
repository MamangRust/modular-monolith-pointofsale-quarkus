quarkus.grpc.server.port=9012
quarkus.grpc.server.host=0.0.0.0

quarkus.http.port=8092
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:DRAGON}
quarkus.datasource.password=${DB_PASS:DRAGON}
quarkus.datasource.reactive.url=postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PAYMENT_GATEWAY}

quarkus.arc.remove-unused-beans=true
quarkus.grpc.server.use-separate-server=true

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

quarkus.grpc.clients.user.host=${USER_GRPC_HOST:localhost}
quarkus.grpc.clients.user.port=${USER_GRPC_PORT:9011}

quarkus.grpc.clients.role.host=${ROLE_GRPC_HOST:localhost}
quarkus.grpc.clients.role.port=${ROLE_GRPC_PORT:9006}

quarkus.log.level=INFO
quarkus.log.category."com.sanedge".level=DEBUG

# ── Transactional outbox (Fase 11) ─────────────────────────────────────
outbox.publisher.enabled=${OUTBOX_PUBLISHER_ENABLED:true}
outbox.publisher.interval-ms=${OUTBOX_PUBLISHER_INTERVAL_MS:5000}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:50}
outbox.publisher.max-attempts=${OUTBOX_PUBLISHER_MAX_ATTEMPTS:5}

# JWT Configuration
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://example-quarkus-opentelemetry.com
mp.jwt.token.header=Authorization
app.jwtExpirationMs=604800000
app.jwtRefreshExpirationMs=86400000

# Redis Config (cluster mode — REDIS_HOSTS diisi docker.env / k8s)
quarkus.redis.hosts=${REDIS_HOSTS:redis://:dragon_knight@redis:6379}

quarkus.index-dependency.common.group-id=com.sanedge
quarkus.index-dependency.common.artifact-id=common
