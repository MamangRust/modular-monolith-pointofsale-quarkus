    errorBody: '{"error":"unauthorized","message":"Simulated chaos token refresh failure"}'
    latencyMs: 500

  - name: "http-auth-me-timeout"
    type: "http"
    target: "GET:/api/auth/me"
    enabled: false
    errorChance: 0.2
    latencyMs: 2500

