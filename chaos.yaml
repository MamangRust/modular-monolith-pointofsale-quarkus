  # ── Auth ──────────────────────────────────────
  - name: "http-auth-login-rate-limit"
    type: "http"
    target: "POST:/api/auth/login"
    enabled: false
    errorChance: 0.4
    errorCode: 429
    errorBody: '{"error":"too_many_requests","message":"Rate limit exceeded by chaos simulation"}'
    latencyMs: 1000

  - name: "http-auth-login-delay"
    type: "http"
    target: "POST:/api/auth/login"
    enabled: false
    errorChance: 0.15
    latencyMs: 2000

  - name: "http-auth-register-error"
    type: "http"
    target: "POST:/api/auth/register"
    enabled: false
    errorChance: 0.2
    errorCode: 500
    errorBody: '{"error":"internal_error","message":"Simulated chaos error on registration"}'
    latencyMs: 800

  - name: "http-auth-forgot-password-delay"
